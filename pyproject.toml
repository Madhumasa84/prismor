[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prismor"
dynamic = ["version"]
description = "Runtime security for AI coding agents: policy enforcement, secret prevention, and supply-chain blocking."
readme = "PYPI.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Prismor Security", email = "hello@prismor.dev" }]
keywords = [
    "security",
    "ai-agents",
    "llm",
    "prompt-injection",
    "supply-chain",
    "claude-code",
    "policy-enforcement",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["build", "pytest"]
# Framework adapters ship inside this package (prismor.warden.<framework>);
# the extras just pull the framework itself so `pip install "prismor[langchain]"`
# is a one-liner. See adapters/ for the sources and docs/frameworks-*.
langchain = ["langchain-core>=0.2"]
crewai = ["crewai>=0.30"]
openai-agents = ["openai-agents>=0.0.1"]
browser-use = ["browser-use>=0.1.0"]
frameworks = [
    "langchain-core>=0.2",
    "crewai>=0.30",
    "openai-agents>=0.0.1",
    "browser-use>=0.1.0",
]

[project.urls]
Homepage = "https://prismor.dev"
Repository = "https://github.com/PrismorSec/prismor"
Documentation = "https://docs.prismor.dev"

[project.scripts]
prismor = "warden.immunity_cli:main"
immunity = "warden.immunity_cli:main"   # deprecated alias — prints a notice; removed in a future release
warden = "warden.immunity_cli:_warden_shim"

# Hermes Agent plugin auto-discovery entry point
[project.entry-points."hermes_agent.plugins"]
prismor-warden-cloak = "warden.cloaking.hermes_plugin_entry:register"

[tool.hatch.version]
path = "warden/__init__.py"

[tool.hatch.build.targets.wheel]
packages = [
    "warden",
    "supplychain",
    # Framework adapter implementations — bundled so the extras above work
    # without separate adapter packages on PyPI.
    "adapters/langchain/prismor_warden_langchain",
    "adapters/crewai/prismor_warden_crewai",
    "adapters/openai-agents/prismor_warden_openai",
    "adapters/browser-use/prismor_warden_browser_use",
]

# Bundle runtime data into the wheel under warden/data/
[tool.hatch.build.targets.wheel.force-include]
# prismor.warden.<framework> namespace shims (PEP 420 — no __init__.py above
# the leaf, so the prismor/ and prismor/warden/ levels stay namespaces).
"adapters/langchain/prismor/warden/langchain/__init__.py" = "prismor/warden/langchain/__init__.py"
"adapters/crewai/prismor/warden/crewai/__init__.py" = "prismor/warden/crewai/__init__.py"
"adapters/openai-agents/prismor/warden/openai/__init__.py" = "prismor/warden/openai/__init__.py"
"adapters/browser-use/prismor/warden/browser_use/__init__.py" = "prismor/warden/browser_use/__init__.py"
"immunity-agent.pth" = "immunity-agent.pth"
"advisories/immunity-feed.json" = "warden/data/advisories/immunity-feed.json"
"advisories/immunity-feed.json.sig" = "warden/data/advisories/immunity-feed.json.sig"
"keys/public.pub" = "warden/data/keys/public.pub"
"templates/policy-tests-owasp.yaml" = "warden/data/templates/policy-tests-owasp.yaml"
"templates/CLAUDE.md.template" = "warden/data/templates/CLAUDE.md.template"
"warden/cloaking/hermes-plugin/plugin.yaml" = "warden/data/cloaking/hermes-plugin/plugin.yaml"
"warden/cloaking/hermes-plugin/__init__.py" = "warden/data/cloaking/hermes-plugin/__init__.py"
# Bundle the immunity-agent Claude skill (SKILL.md + its docs/, minus the heavy
# unreferenced demo.gif) so `prismor setup` can install it into a workspace's
# .claude/skills/ directory. Files are listed explicitly — a `docs/` directory
# mapping would drag in demo.gif (force-include ignores wheel `exclude`).
"SKILL.md" = "warden/data/SKILL.md"
"docs/architecture.md" = "warden/data/docs/architecture.md"
"docs/canary.md" = "warden/data/docs/canary.md"
"docs/cli-reference.md" = "warden/data/docs/cli-reference.md"
"docs/connecting-to-the-platform.md" = "warden/data/docs/connecting-to-the-platform.md"
"docs/dashboard.md" = "warden/data/docs/dashboard.md"
"docs/docker.md" = "warden/data/docs/docker.md"
"docs/frameworks-browser-use.md" = "warden/data/docs/frameworks-browser-use.md"
"docs/frameworks-crewai.md" = "warden/data/docs/frameworks-crewai.md"
"docs/frameworks-langchain.md" = "warden/data/docs/frameworks-langchain.md"
"docs/frameworks-openai-agents.md" = "warden/data/docs/frameworks-openai-agents.md"
"docs/frameworks-overview.md" = "warden/data/docs/frameworks-overview.md"
"docs/frameworks-vercel-ai.md" = "warden/data/docs/frameworks-vercel-ai.md"
"docs/hermes.md" = "warden/data/docs/hermes.md"
"docs/iam.md" = "warden/data/docs/iam.md"
"docs/learning.md" = "warden/data/docs/learning.md"
"docs/live-telemetry.md" = "warden/data/docs/live-telemetry.md"
"docs/network-isolation.md" = "warden/data/docs/network-isolation.md"
"docs/policy-layers-and-exemptions.md" = "warden/data/docs/policy-layers-and-exemptions.md"
"docs/scoped-agent.md" = "warden/data/docs/scoped-agent.md"
"docs/sdk-integration.md" = "warden/data/docs/sdk-integration.md"
"docs/semantic-guard.md" = "warden/data/docs/semantic-guard.md"
"docs/skill-scanner.md" = "warden/data/docs/skill-scanner.md"
"docs/supply-chain.md" = "warden/data/docs/supply-chain.md"
"docs/sweep-and-cloak.md" = "warden/data/docs/sweep-and-cloak.md"
"docs/warden.md" = "warden/data/docs/warden.md"

[tool.hatch.build.targets.sdist]
include = [
    "warden/",
    "supplychain/",
    "immunity-agent.pth",
    "advisories/immunity-feed.json",
    "advisories/immunity-feed.json.sig",
    "keys/public.pub",
    "templates/",
    # Bundled Claude skill — needed in the sdist so the wheel's force-include
    # (build_wheel runs from the unpacked sdist) can find them. Only the .md
    # files; the heavy unreferenced docs/demo.gif stays out.
    "SKILL.md",
    "docs/*.md",
    "PYPI.md",
    "LICENSE",
]
