[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prismor-crewai"
version = "0.2.0"
description = "Prismor adapter for CrewAI — per-user runtime tool-call policy for production agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prismor" }]
keywords = ["crewai", "security", "policy", "guardrail", "prismor", "prismor"]

dependencies = [
    "prismor>=1.13.0",
]

[project.optional-dependencies]
crewai = ["crewai>=0.30"]

[tool.hatch.build.targets.wheel]
packages = ["prismor_crewai", "prismor"]
