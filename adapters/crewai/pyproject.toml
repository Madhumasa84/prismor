[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prismor-warden-crewai"
version = "0.1.0"
description = "Prismor Warden adapter for CrewAI — per-user runtime tool-call policy for production agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prismor" }]
keywords = ["crewai", "security", "policy", "guardrail", "prismor", "warden"]

dependencies = [
    "immunity-agent>=1.11.0",
]

[project.optional-dependencies]
crewai = ["crewai>=0.30"]

[tool.hatch.build.targets.wheel]
packages = ["prismor_warden_crewai"]
