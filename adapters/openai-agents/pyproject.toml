[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prismor-warden-openai"
version = "0.1.0"
description = "Prismor Warden adapter for the OpenAI Agents SDK — per-user runtime tool-call policy for production agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Prismor" }]
keywords = ["openai", "agents", "security", "policy", "guardrail", "prismor", "warden"]

# Requires the Prismor Warden runtime (the `warden` package) to be importable.
# It provides the shared policy engine + evaluate_tool_call entrypoint.
dependencies = [
    "immunity-agent>=1.11.0",
]

[project.optional-dependencies]
# The OpenAI Agents SDK itself — only needed to actually run an Agent; the
# adapter wraps plain callables without it (so it is unit-testable standalone).
sdk = ["openai-agents>=0.0.1"]

[tool.hatch.build.targets.wheel]
packages = ["prismor_warden_openai"]
