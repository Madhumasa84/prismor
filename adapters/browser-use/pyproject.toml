[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prismor-warden-browser-use"
version = "0.2.0"
description = "Prismor Warden adapter for browser-use — policy-controlled browser actions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["prismor>=1.13.0"]

[project.optional-dependencies]
browser = ["browser-use>=0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["prismor_warden_browser_use", "prismor"]
